# Equipe Paraba — Site (Nginx)
#
# Copie para a VPS:
#   sudo cp nginx.conf /etc/nginx/sites-available/paraba-site
#   sudo ln -sf /etc/nginx/sites-available/paraba-site /etc/nginx/sites-enabled/paraba-site
#   sudo nginx -t && sudo systemctl reload nginx
#
# Depois aponte o DNS do dominio para 167.233.239.13
# e (opcional) rode certbot:
#   sudo certbot --nginx -d seudominio.com.br

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /opt/paraba-site/dist;
    index index.html;

    # SPA (React Router): qualquer rota cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets com hash do Vite
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /favicon.png {
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
