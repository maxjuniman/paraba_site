name: Deploy Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: paraba-site-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        env:
          VITE_PARABA_API_URL: ${{ secrets.VITE_PARABA_API_URL }}
        run: |
          if [ -z "${VITE_PARABA_API_URL}" ]; then
            echo "Secret VITE_PARABA_API_URL nao configurado."
            exit 1
          fi
          npm ci
          npm run build

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -z "${VPS_SSH_KEY:-}" ]; then
            echo "Secret VPS_SSH_KEY nao configurado."
            exit 1
          fi

          # Grava via env (melhor que interpolar no YAML)
          printenv VPS_SSH_KEY | tr -d '\r' > ~/.ssh/paraba-site
          chmod 600 ~/.ssh/paraba-site

          if ! grep -q "BEGIN .*PRIVATE KEY" ~/.ssh/paraba-site; then
            echo "VPS_SSH_KEY parece nao ser uma chave PRIVADA."
            echo "Cole o arquivo completo com BEGIN/END PRIVATE KEY (nao use a .pub)."
            exit 1
          fi

          if ! ssh-keygen -y -f ~/.ssh/paraba-site >/dev/null; then
            echo "VPS_SSH_KEY invalida (error in libcrypto)."
            echo "Gere um novo par e cadastre de novo no GitHub (veja README)."
            exit 1
          fi

          ssh-keyscan -H 167.233.239.13 >> ~/.ssh/known_hosts

      - name: Ensure remote directory
        run: |
          ssh -i ~/.ssh/paraba-site maxfoot@167.233.239.13 \
            'mkdir -p /opt/paraba-site/dist && sudo chown -R maxfoot:maxfoot /opt/paraba-site'

      - name: Upload build
        run: |
          rsync -az --delete \
            -e 'ssh -i ~/.ssh/paraba-site -o StrictHostKeyChecking=yes' \
            dist/ maxfoot@167.233.239.13:/opt/paraba-site/dist/

      - name: Reload Nginx
        run: |
          ssh -i ~/.ssh/paraba-site maxfoot@167.233.239.13 \
            'sudo nginx -t && sudo systemctl reload nginx'
